services:
  answer:
    image: apache/answer:2.0.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ANSWER_PORT:-9080}:80"
    volumes:
      - ./data/answer:/data
  mcp:
    build: ./mcp
    restart: unless-stopped
    depends_on:
      - answer
    ports:
      - "127.0.0.1:${MCP_PORT:-9081}:3000"
    environment:
      ANSWER_BASE_URL: http://answer
      MCP_AGENTS_FILE: /run/agentic-answers/agents.json
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ./data/mcp:/run/agentic-answers:ro
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
